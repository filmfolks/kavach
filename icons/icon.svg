<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="chakraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#shieldGrad)" />
  
  <!-- Outer Shield Trim (Glow) -->
  <path d="M 256 50 C 370 50 430 100 430 200 C 430 350 256 460 256 460 C 256 460 82 350 82 200 C 82 100 142 50 256 50 Z" 
        fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#shieldShadow)" />

  <!-- Inner Shield Body -->
  <path d="M 256 68 C 354 68 410 112 410 198 C 410 330 256 438 256 438 C 256 438 102 330 102 198 C 102 112 158 68 256 68 Z" 
        fill="#0b1120" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Core Emblem: Central Protective Chakra & Check/Lock -->
  <circle cx="256" cy="235" r="92" fill="none" stroke="url(#chakraGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="256" cy="235" r="70" fill="#111827" stroke="#38bdf8" stroke-width="4" />

  <!-- Protective Fortress / Kavach Node -->
  <path d="M 230 230 L 248 248 L 292 202" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Safety Tricolor Subtle Micro-Ribbon -->
  <path d="M 200 370 Q 256 390 312 370" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 215 382 Q 256 398 297 382" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 230 394 Q 256 406 282 394" stroke="#22c55e" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
